      const text = await res.text();
      if (seq !== openSeq) return;
      $('readerBody').innerHTML = renderMarkdown(text);
      scrollToAnchor(anchor);
    } catch (e) {
      if (seq !== openSeq) return;
      const gh = githubBlobUrl(node.id);
      $('readerBody').innerHTML =
        '<p class="empty">未能读取笔记正文（' + escapeHtml(e.message) + '）。</p>' +
        '<p>路径：<code>' + escapeHtml(node.id) + '</code></p>' +
        (gh ? '<p><a href="' + escapeHtml(gh) + '" target="_blank" rel="noopener">在 GitHub 打开此笔记 →</a></p>' : '') +
        '<p class="empty">若部署于 GitHub Pages，请确认仓库根目录存在 <code>.nojekyll</code>，否则 .md 会被 Jekyll 转译而无法直读。</p>';
    }
  }

  function showNote(node, anchor) {
    currentNote = node;
    readerEl.classList.remove('shattering');
    readerEl.classList.add('on');
    readerMask.classList.add('on');
    readerOpen = true;
    $('readerTitle').textContent = node.name;
    $('readerPath').textContent = node.id;
    $('readerPath').style.color = '';
    fx.restore(readerEl.getBoundingClientRect());
    loadNote(node, anchor || '');
  }

  function openReader(node, ev) {
    clearWave();
    clearTimeout(closeTimer);
    clearTimeout(panelTimer);
    tip.hidden = true;
    if (drag) { drag = null; controls.enabled = true; }
    controls.autoRotate = false;

    readerStack = [];
    closing = false;
    readerEl.classList.remove('shattering');
    readerEl.classList.add('on');
    readerMask.classList.add('on');
    readerOpen = true;
    currentNote = node;
    $('readerTitle').textContent = node.name;
    $('readerPath').textContent = node.id;
    $('readerPath').style.color = '';
    if (!reduceMotion) fx.burst(ev.clientX, ev.clientY);
    panelTimer = setTimeout(
      () => fx.setPanel(readerEl.getBoundingClientRect()),
      reduceMotion ? 0 : 1100
    );
    loadNote(node, '');
  }

  function closeReader() {
    if (!readerOpen || closing) return;
    closing = true;
    readerOpen = false;
    openSeq++;
    clearTimeout(panelTimer);
    clearTimeout(closeTimer);
    clearTimeout(wikiTipTimer);
    tip.hidden = true;
    fx.dissolve();
    readerEl.classList.add('shattering');
    closeTimer = setTimeout(() => {
      if (readerStack.length) {
        showNote(readerStack.pop());
      } else {
        readerMask.classList.remove('on');
        readerEl.classList.remove('on', 'shattering');
        readerEl.style.left = readerEl.style.top = readerEl.style.width = readerEl.style.height = '';
        $('readerBody').innerHTML = '';
        currentNote = null;
        controls.autoRotate = !reduceMotion && !activeCluster;
      }
      closing = false;
    }, reduceMotion ? 0 : SHATTER_MS);
  }

  /* 浮层内点击双链：切换正文，并把当前笔记压入历史 */
  $('readerBody').addEventListener('click', (ev) => {
    const a = ev.target.closest('a.wiki');
    if (!a || !currentNote || closing) return;
    ev.preventDefault();
    const raw = a.dataset.wiki || '';
    const r = resolveWiki(raw, currentNote.id);
    if (!r.node) {
      a.classList.add('missing');
      a.title = '未找到对应笔记：' + raw;
      const pathEl = $('readerPath');
      pathEl.textContent = '未找到对应笔记：' + raw;
      pathEl.style.color = '#b9381f';
      clearTimeout(wikiTipTimer);
      wikiTipTimer = setTimeout(() => {
        pathEl.textContent = currentNote ? currentNote.id : '';
        pathEl.style.color = '';
      }, 2200);
      return;
    }
    readerStack.push(currentNote);
    showNote(r.node, r.anchor);
  });

  /* 四边 / 四角拖拽调整浮层大小，光晕实时跟随 */
  function initReaderResize() {
    const dirs = ['n', 's', 'e', 'w', 'ne', 'nw', 'se', 'sw'];
    for (const d of dirs) {
      const h = document.createElement('div');
      h.className = 'rs rs-' + d;
      h.dataset.rs = d;
      readerEl.appendChild(h);
    }
    let rs = null;
    readerEl.addEventListener('pointerdown', (ev) => {
      const h = ev.target.closest('.rs');
      if (!h || !readerOpen || closing) return;
      rs = { d: h.dataset.rs, x: ev.clientX, y: ev.clientY, r: readerEl.getBoundingClientRect() };
      try { if (readerEl.setPointerCapture) readerEl.setPointerCapture(ev.pointerId); } catch (_) {}
      ev.preventDefault(); ev.stopPropagation();
    });
    readerEl.addEventListener('pointermove', (ev) => {
      if (!rs) return;
      const dx = ev.clientX - rs.x, dy = ev.clientY - rs.y;
      const maxW = window.innerWidth - 32, maxH = window.innerHeight - 32;
      let l = rs.r.left, t = rs.r.top, w = rs.r.width, hgt = rs.r.height;
      const d = rs.d;
      if (d.includes('e')) w = clamp(rs.r.width + dx, 460, maxW);
      if (d.includes('w')) { w = clamp(rs.r.width - dx, 460, maxW); l = rs.r.left + rs.r.width - w; }
      if (d.includes('s')) hgt = clamp(rs.r.height + dy, 320, maxH);
      if (d.includes('n')) { hgt = clamp(rs.r.height - dy, 320, maxH); t = rs.r.top + rs.r.height - hgt; }
      readerEl.style.left = (l + w / 2) + 'px';
      readerEl.style.top = (t + hgt / 2) + 'px';
      readerEl.style.width = w + 'px';
      readerEl.style.height = hgt + 'px';
      fx.setPanel(readerEl.getBoundingClientRect());
      ev.preventDefault();
    });
    const end = () => { rs = null; };
    readerEl.addEventListener('pointerup', end);
    readerEl.addEventListener('pointercancel', end);
  }
  initReaderResize();

  function pickForOpen(ev) {
    updatePointer(ev);
    raycaster.setFromCamera(pointer, camera);
    const targets = [];
    for (const n of allNodes) {
      if (n.cluster.visT > 0.5) targets.push(n.pick, n.label);
    }
    const hits = raycaster.intersectObjects(targets, false);
    return hits.length ? (hits[0].object.userData.node || null) : null;
  }

  renderer.domElement.addEventListener('dblclick', (ev) => {
    const node = pickForOpen(ev);
    if (node) openReader(node, ev);
  });
  $('readerClose').addEventListener('click', closeReader);
  readerMask.addEventListener('click', closeReader);
  window.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && readerOpen) closeReader();
  });

  /* ============================================================
     HUD
     ============================================================ */

  function clusterView(c) {
    camTween = {
      fromPos: camera.position.clone(),
      toPos: c.anchor.clone().add(new THREE.Vector3(0, c.spread * 0.5, c.spread * 1.6 + 12)),
      fromTarget: controls.target.clone(),
      toTarget: c.anchor.clone(),
      start: performance.now(), dur: 900
    };
    controls.autoRotate = false;
  }

  function focusCluster(c) {
    activeCluster = c;
    clearWave();
    clusterView(c);
    syncScroll();
  }

  function goHome() {
    activeCluster = null;
    clearWave();
    for (const c of clusters) resetShape(c);
    camTween = {
      fromPos: camera.position.clone(), toPos: HOME.pos.clone(),
      fromTarget: controls.target.clone(), toTarget: HOME.target.clone(),
      start: performance.now(), dur: 900
    };
    controls.autoRotate = !reduceMotion;
    syncScroll();
  }

  /* ============================================================
     Three.js 竹简卷轴 · 天书识海
       参考图一：卷起的竹简（竹条弧面 / 绑绳 / 金字题签 / 流苏）
       参考图二：展开的竹简（竖排墨字 / 雷纹编绳 / 左端卷边）
       参考图三：铜杆白锋毛笔（点击卷轴时挥毫点简）
     独立正交相机 + 独立渲染层，不干扰主星云场景
     ============================================================ */

  let scrollUI = null;

  function createScrollUI(list, onPick, meta) {
    const W = 560, H = 300, U = 100;   // 1 世界单位 = 100 px
    const ROLL_X = -1.95;
    const SLIP_X0 = -1.62;
    const SLIP_W = .315;
    const AREA_RIGHT = 2.55;          // 画布右侧留白（世界坐标，画布 x ∈ [-2.8, 2.8]）
    const canvas = $('scrollCanvas');
    const hitLayer = $('scrollHit');
    const host = $('scroll3d');

    let r;
    try {
      r = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, powerPreference: 'low-power' });
    } catch (e) {
      return null;
    }
    r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.6));
    r.setSize(W, H, false);
    r.setClearColor(0x000000, 0);

    const sc = new THREE.Scene();
    const cam = new THREE.OrthographicCamera(-W / (2 * U), W / (2 * U), H / (2 * U), -H / (2 * U), 0.1, 120);
    cam.position.set(0, 4.5, 30);
    cam.lookAt(0, 0, 0);
    sc.add(new THREE.AmbientLight(0xffe9c4, 1.45));
    const keyLight = new THREE.DirectionalLight(0xfff2d6, 2.3);
    keyLight.position.set(-4, 5, 12); sc.add(keyLight);
    const rimLight = new THREE.DirectionalLight(0x9fb4d0, .65);
    rimLight.position.set(6, -3, 5); sc.add(rimLight);

    const cv = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
    const toTex = (c) => {
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = 4;
      return t;
    };
    const FONT = '"STKaiti","KaiTi","Songti SC","Noto Serif SC",serif';
    const smooth = (k) => { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); };

    // 竹材：橙黄横向渐变 + 竖向纤维
    function bamboo(w, h) {
      const c = cv(w, h), x = c.getContext('2d');
      const g = x.createLinearGradient(0, 0, w, 0);
      g.addColorStop(0, '#7b5722');
      g.addColorStop(.13, '#c99a45');
      g.addColorStop(.4, '#e3b962');
      g.addColorStop(.72, '#c5933f');
      g.addColorStop(1, '#78531f');
      x.fillStyle = g; x.fillRect(0, 0, w, h);
      for (let i = 0; i < Math.round(w / 3); i++) {
        const px = Math.random() * w;
        x.strokeStyle = Math.random() < .5
          ? 'rgba(84,52,16,' + (.03 + Math.random() * .07) + ')'
          : 'rgba(255,229,166,' + (.03 + Math.random() * .07) + ')';
        x.lineWidth = .6 + Math.random() * 1.1;
        x.beginPath(); x.moveTo(px, 0);
        x.bezierCurveTo(px + 2, h * .33, px - 2, h * .68, px, h); x.stroke();
      }
      return { c, x };
    }

    // 连续雷纹带（图二编绳处的装饰）
    function meander(x, w, y, h, unit) {
      x.save();
      x.strokeStyle = 'rgba(58,34,12,.85)';
      x.lineWidth = Math.max(1, h * .09);
      for (let px = 0; px < w; px += unit) {
        x.beginPath();
        x.moveTo(px + 2, y + h - 3);
        x.lineTo(px + 2, y + 3);
        x.lineTo(px + unit - 4, y + 3);
        x.lineTo(px + unit - 4, y + h - 6);
        x.lineTo(px + 7, y + h - 6);
        x.lineTo(px + 7, y + h * .42);
        x.stroke();
      }
      x.restore();
    }

    // 卷轴圆柱：20 条竹片绕筒一周 + 中部绑绳
    function rollTexture() {
      const w = 512, h = 1024;
      const { c, x } = bamboo(w, h);
      for (let i = 1; i < 20; i++) {
        const px = i * w / 20;
        x.fillStyle = 'rgba(58,36,12,.55)'; x.fillRect(px - 1.5, 0, 3, h);
        x.fillStyle = 'rgba(255,230,168,.2)'; x.fillRect(px + 2, 0, 2, h);
      }
      x.fillStyle = 'rgba(46,28,10,.8)';
      x.fillRect(0, 0, w, 16); x.fillRect(0, h - 16, w, 16);
      x.fillStyle = 'rgba(70,42,14,.55)';
      x.fillRect(0, 58, w, 5); x.fillRect(0, h - 63, w, 5);
      x.fillStyle = 'rgba(52,28,12,.94)'; x.fillRect(0, h * .49, w, 34);
      x.strokeStyle = 'rgba(190,142,78,.5)'; x.lineWidth = 2;
      for (let px = 0; px < w; px += 12) {
        x.beginPath(); x.moveTo(px, h * .49 + 3); x.lineTo(px + 9, h * .49 + 31); x.stroke();
      }
      // 圆柱明暗：纹理两端（u=0/1）正对镜头最亮，中央（u=.5）是背面最暗
      const shade = x.createLinearGradient(0, 0, w, 0);
      shade.addColorStop(0, 'rgba(255,240,200,.2)');
      shade.addColorStop(.25, 'rgba(0,0,0,.3)');
      shade.addColorStop(.5, 'rgba(0,0,0,.5)');
      shade.addColorStop(.75, 'rgba(0,0,0,.3)');
      shade.addColorStop(1, 'rgba(255,240,200,.2)');
      x.fillStyle = shade; x.fillRect(0, 0, w, h);
      return toTex(c);
    }

    // 题签：暗色框 + 雷纹 + 竖排金字「天书识海」+ 卷数（星域数量）
    function titleTexture(volumes) {
      const w = 256, h = 512;
      const c = cv(w, h), x = c.getContext('2d');
      const g = x.createLinearGradient(0, 0, w, 0);
      g.addColorStop(0, 'rgba(60,36,14,.78)');
      g.addColorStop(.5, 'rgba(84,52,20,.97)');
      g.addColorStop(1, 'rgba(60,36,14,.78)');
      x.fillStyle = g; x.fillRect(14, 12, w - 28, h - 24);
      meander(x, w, 18, 22, 26);
      meander(x, w, h - 40, 22, 26);
      x.textAlign = 'center'; x.textBaseline = 'middle';
      x.font = '52px ' + FONT;
      x.shadowColor = 'rgba(255,206,110,.85)'; x.shadowBlur = 16;
      ['天', '书', '识', '海'].forEach((ch, i) => {
        x.fillStyle = 'rgba(255,227,160,.96)';
        x.fillText(ch, w / 2, 74 + i * 88);
      });
      x.strokeStyle = 'rgba(226,182,104,.5)'; x.lineWidth = 1.5;
      x.beginPath(); x.moveTo(50, 386); x.lineTo(w - 50, 386); x.stroke();
      x.font = '44px ' + FONT;
      x.shadowBlur = 8;
      x.fillStyle = 'rgba(255,231,170,.97)';
      x.fillText('凡 ' + volumes + ' 卷', w / 2, 428);
      x.shadowBlur = 0;
      return toTex(c);
    }

    // 展开态题头：可重绘的木牌，文字随当前选中 / 悬停的竹简变化
    const BW = 768, BH = 128;
    const bannerCanvas = cv(BW, BH);
    const bx = bannerCanvas.getContext('2d');
    const bannerTex = toTex(bannerCanvas);
    function drawBanner(label) {
      const x = bx;
      x.clearRect(0, 0, BW, BH);
      const g = x.createLinearGradient(0, 0, 0, BH);
      g.addColorStop(0, 'rgba(48,29,11,.86)');
      g.addColorStop(.5, 'rgba(84,52,20,.96)');
      g.addColorStop(1, 'rgba(48,29,11,.86)');
      const r = 14;
      x.beginPath();
      x.moveTo(r, 4); x.lineTo(BW - r, 4); x.quadraticCurveTo(BW - 4, 4, BW - 4, r);
      x.lineTo(BW - 4, BH - r); x.quadraticCurveTo(BW - 4, BH - 4, BW - r, BH - 4);
      x.lineTo(r, BH - 4); x.quadraticCurveTo(4, BH - 4, 4, BH - r);
      x.lineTo(4, r); x.quadraticCurveTo(4, 4, r, 4); x.closePath();
      x.fillStyle = g; x.fill();
      x.strokeStyle = 'rgba(226,182,104,.65)'; x.lineWidth = 3; x.stroke();
      x.strokeStyle = 'rgba(226,182,104,.4)'; x.lineWidth = 2;
      x.beginPath();
      x.moveTo(24, 20); x.lineTo(BW - 24, 20);
      x.moveTo(24, BH - 20); x.lineTo(BW - 24, BH - 20); x.stroke();
      x.textAlign = 'center'; x.textBaseline = 'middle';
      // 星域名过长时自动缩字号，避免溢出木牌
      const fs = Math.min(50, Math.floor((BW - 96) / Array.from(label).length));
      x.font = fs + 'px ' + FONT;
      x.shadowColor = 'rgba(255,206,110,.8)'; x.shadowBlur = 14;
      x.fillStyle = 'rgba(255,231,170,.97)';
      x.fillText(label, BW / 2, BH / 2 + 2);
      x.shadowBlur = 0;
      bannerTex.needsUpdate = true;
    }

    // 单片竹简：竹材 + 雷纹带 + 编绳孔 + 竖排墨字
    function slipTexture(entry) {
      const w = 128, h = 768;
      const { c, x } = bamboo(w, h);
      x.fillStyle = 'rgba(52,32,12,.86)';
      x.fillRect(0, 26, w, 54); x.fillRect(0, h - 92, w, 66);
      x.strokeStyle = 'rgba(226,182,104,.75)'; x.lineWidth = 2;
      meander(x, w, 30, 44, 32);
      meander(x, w, h - 88, 58, 32);
      for (const py of [h - 190, h - 108]) {
        x.fillStyle = 'rgba(38,22,8,.9)';
        x.beginPath(); x.arc(w / 2, py, 6, 0, Math.PI * 2); x.fill();
        x.strokeStyle = 'rgba(255,226,160,.35)'; x.lineWidth = 1.5; x.stroke();
      }
      x.textAlign = 'center'; x.textBaseline = 'middle';
      const chars = Array.from(entry.t);
      const fs = chars.length > 5 ? 46 : 58;
      x.font = fs + 'px ' + FONT;
      const top = 178;
      chars.forEach((ch, i) => {
        x.fillStyle = entry.decor ? 'rgba(74,46,18,.62)' : 'rgba(38,22,8,.92)';
        x.fillText(ch, w / 2, top + i * (fs + 16));
      });
      if (entry.s) {
        x.font = '30px ' + FONT;
        x.fillStyle = 'rgba(78,48,18,.72)';
        Array.from(entry.s).forEach((ch, i) =>
          x.fillText(ch, w / 2, top + chars.length * (fs + 16) + 18 + i * 36));
      }
      return toTex(c);
    }

    /* ---------- 卷起的竹简 ---------- */
    const roll = new THREE.Group();
    roll.position.set(ROLL_X, 0, 0);
    sc.add(roll);

    const body = new THREE.Mesh(
      new THREE.CylinderGeometry(.44, .44, 2.3, 48, 1, false),
      new THREE.MeshStandardMaterial({ map: rollTexture(), roughness: .78, metalness: .04 })
    );
    roll.add(body);

    // 贴着弧面的题签扇区（theta -0.72 ~ 0.72 正对相机）
    const titleMesh = new THREE.Mesh(
      new THREE.CylinderGeometry(.49, .49, 1.2, 32, 1, true, -.72, 1.44),
      new THREE.MeshBasicMaterial({ map: titleTexture(meta.volumes), transparent: true, side: THREE.DoubleSide, depthWrite: false })
    );
    roll.add(titleMesh);

    const cordMat = new THREE.MeshStandardMaterial({ color: 0x3a2410, roughness: .9 });
    for (const y of [0]) {
      const t = new THREE.Mesh(new THREE.TorusGeometry(.448, .022, 8, 48), cordMat);
      t.rotation.x = Math.PI / 2; t.position.y = y; roll.add(t);
    }
    for (const y of [1.15, -1.15]) {
      const cap = new THREE.Mesh(
        new THREE.TorusGeometry(.41, .028, 8, 40),
        new THREE.MeshStandardMaterial({ color: 0x6a451c, roughness: .85 })
      );
      cap.rotation.x = Math.PI / 2; cap.position.y = y; roll.add(cap);
    }
    for (let i = 0; i < 7; i++) {
      const s = new THREE.Mesh(new THREE.CylinderGeometry(.004, .001, .55 + Math.random() * .2, 4), cordMat);
      s.position.set(-.46 - i * .018, -.34, .12 + i * .01);
      s.rotation.z = -.25 - i * .05;
      roll.add(s);
    }
    const rollHit = new THREE.Mesh(
      new THREE.CylinderGeometry(.52, .52, 2.45, 12),
      new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })
    );
    roll.add(rollHit);

    /* ---------- 展开的竹简：每片真实星域对应一片，不足 9 片用 DECOR 补装饰 ---------- */
    // 装饰题名：顺序取用、不循环回头；词表用尽时以编号兜底，保证同屏不重名
    const DECOR = [
      '星垂平野', '墨海拾遗', '卷帙流光', '万象归藏', '以文观天',
      '斗转星移', '云篆天章', '星槎问津', '汗青余韵', '河汉流辉'
    ];
    const N = Math.max(9, 2 + list.length);
    // 「全部星域」总览片已去掉：全景还原改由再次点击卷轴收卷时触发
    const entries = list.map((v, i) => ({ t: v.vaultName, s: v.mdCount + ' 篇', pick: i }));
    let d = 0;
    while (entries.length < N) {
      entries.push({ t: DECOR[d] || ('逸简·' + (d + 1)), s: '', pick: null, decor: true });
      d++;
    }

    // 片多时自动收窄间距，保证整排始终落在画布内；片少时保持原有密度
    const gap = N > 1 ? Math.min(.355, (AREA_RIGHT - SLIP_X0 - SLIP_W / 2) / (N - 1)) : 0;
    const span = (N - 1) * gap;
    const stagger = .35 / Math.max(1, N - 1);   // 展卷错峰按片数归一化，避免末片展不开
    const cordSpan = span + .32;
    const cordX0 = SLIP_X0 - .16;
    // 命中层只覆盖实际竹简宽度，避免收窄后仍吞掉主星云的鼠标事件
    host.style.setProperty('--hit-open-w',
      Math.max(118, Math.round((SLIP_X0 + span + SLIP_W / 2 + W / (2 * U)) * U - 24 + 16)) + 'px');

    const slipGeo = new THREE.BoxGeometry(SLIP_W, 2.16, .05);
    const slips = [];
    for (let i = 0; i < entries.length; i++) {
      const e = entries[i];
      const m = new THREE.Mesh(slipGeo, new THREE.MeshStandardMaterial({
        map: slipTexture(e), transparent: true, opacity: 0,
        roughness: .8, metalness: .03, depthWrite: false,
        emissive: new THREE.Color(0x6a4712), emissiveIntensity: 0
      }));
      m.position.set(ROLL_X, 0, .12);
      m.rotation.y = Math.PI / 2;
      m.userData = {
        i, pick: e.pick,
        targetX: SLIP_X0 + i * gap,
        targetZ: .12 + Math.sin(i * .8) * .035
      };
      sc.add(m);
      slips.push(m);
    }

    // 两道编绳 + 结点
    const cords = new THREE.Group();
    const cordMat2 = new THREE.MeshStandardMaterial({
      color: 0x5a2f18, roughness: .85, transparent: true, opacity: 0,
      depthWrite: false, depthTest: false
    });
    const cordLines = [], cordKnots = [];
    for (const y of [-.55, -.78]) {
      const line = new THREE.Mesh(new THREE.CylinderGeometry(.012, .012, cordSpan, 6), cordMat2);
      line.rotation.z = Math.PI / 2;
      line.position.set(cordX0 + cordSpan / 2, y, .19);
      line.renderOrder = 3;
      cords.add(line);
      cordLines.push(line);
      for (let i = 0; i < N; i++) {
        const knot = new THREE.Mesh(new THREE.SphereGeometry(.026, 8, 6), cordMat2);
        knot.position.set(SLIP_X0 + i * gap, y, .2);
        knot.renderOrder = 3;
        cords.add(knot);
        cordKnots.push({ mesh: knot, i });
      }
    }
    sc.add(cords);

    // 展开后浮于竹简上沿的册数题头（文件节点数）
    const banner = new THREE.Mesh(
      new THREE.PlaneGeometry(2.45, .4),
      new THREE.MeshBasicMaterial({
        map: bannerTex, transparent: true, opacity: 0, depthWrite: false
      })
    );
    banner.position.set(SLIP_X0 + span / 2, 1.28, .28);
    banner.renderOrder = 4;
    sc.add(banner);

    // 当前星域的竹简：背后一圈金色柔光
    const activeGlow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: makeGlowTexture('rgba(255,214,130,.9)', 'rgba(216,160,60,.35)'),
      transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false
    }));
    activeGlow.scale.set(.66, 2.6, 1);
    sc.add(activeGlow);

    /* ---------- 毛笔：铜杆 + 白锋 ---------- */
    const brush = new THREE.Group();
    const profile = [
      [0, 0], [.03, .05], [.075, .16], [.112, .31], [.132, .46], [.118, .58]
    ].map(([a, b]) => new THREE.Vector2(a, b));
    brush.add(new THREE.Mesh(
      new THREE.LatheGeometry(profile, 20),
      new THREE.MeshStandardMaterial({ color: 0xf3e9d2, roughness: .88 })
    ));
    const shaft = new THREE.Mesh(
      new THREE.CylinderGeometry(.072, .088, 1.6, 18),
      new THREE.MeshStandardMaterial({ color: 0x8c4a28, roughness: .4, metalness: .45 })
    );
    shaft.position.y = .58 + .8; brush.add(shaft);
    const brass = new THREE.MeshStandardMaterial({ color: 0xc9a45c, roughness: .3, metalness: .85 });
    for (const y of [.61, .78, 2.14]) {
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(y > 2 ? .078 : (y < .7 ? .115 : .085), .016, 8, 24), brass
      );
      ring.rotation.x = Math.PI / 2; ring.position.y = y; brush.add(ring);
    }
    const cap = new THREE.Mesh(new THREE.SphereGeometry(.075, 12, 10), brass);
    cap.position.y = 2.22; brush.add(cap);
    brush.rotation.z = -.58;
    sc.add(brush);
    const BRUSH_IDLE = new THREE.Vector3(2.02, -.34, 1.4);
    const brushPre = new THREE.Vector3(ROLL_X + .08, 1.0, 1.4);
    const brushTap = new THREE.Vector3(ROLL_X + .06, .72, 1.4);
    brush.position.copy(BRUSH_IDLE);
    brush.visible = false;   // 默认隐藏：仅点击卷轴 / 竹简时显现

    // 笔尖触简时的金色墨晕
    const ripple = new THREE.Sprite(new THREE.SpriteMaterial({
      map: makeGlowTexture('rgba(255,228,164,.95)', 'rgba(216,185,120,.4)'),
      transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false
    }));
    ripple.position.set(ROLL_X + .06, .72, 1.7);
    sc.add(ripple);

    /* ---------- 状态机 ---------- */
    let open = false, target = 0, prog = 0, pending = null;
    let brushT = -1, rippleT = -1;
    let activeIdx = -1, hoverIdx = -1;
    let brushAction = null;
    let currentLabel = '';

    // 题头文字：星域名 + 该星域册数；全景（未选中任何竹简）显示总册数
    function bannerLabel(idx) {
      const e = entries[idx] || {};
      if (e.pick === null) return bannerLabel(activeIdx);   // 装饰竹简回退到当前选中
      if (e.pick === undefined) return '全部星域 · 凡 ' + meta.books + ' 册';
      return e.t + ' · 凡 ' + list[e.pick].mdCount + ' 册';
    }

    // tapX：笔尖落点；onTap：笔尖触简时执行；toggleOpen：是否连带展卷 / 卷回
    function triggerBrush(tapX, onTap, toggleOpen) {
      if (brushT >= 0) return;   // 挥毫过程中忽略重复点击
      brushT = 0;
      brush.visible = true;
      const tx = tapX === undefined ? ROLL_X + .06 : tapX;
      brushPre.set(tx + .02, 1.0, 1.4);
      brushTap.set(tx, .72, 1.4);
      ripple.position.x = tx;
      brushAction = onTap || null;
      pending = toggleOpen ? !open : null;   // 笔尖落下后才开始展卷 / 卷回
    }

    function update(dt) {
      if (brushT >= 0) {
        brushT += dt;
        const t = brushT;
        if (t < .42) {
          brush.position.lerpVectors(BRUSH_IDLE, brushPre, smooth(t / .42));
          brush.rotation.z = -.58 + .12 * smooth(t / .42);
        } else if (t < .52) {
          brush.position.lerpVectors(brushPre, brushTap, smooth((t - .42) / .1));
          if (rippleT < 0) rippleT = 0;
        } else if (t < .76) {
          brush.position.lerpVectors(brushTap, brushPre, smooth((t - .52) / .24));
          if (pending !== null) {
            const closing = !pending;
            open = pending; target = open ? 1 : 0; pending = null;
            if (closing) onPick(-1);   // 卷回收起时还原星云全景（相机、星云形态、自动旋转）
          }
          if (brushAction) { const fn = brushAction; brushAction = null; fn(); }
        } else if (t < 1.4) {
          brush.position.lerpVectors(brushPre, BRUSH_IDLE, smooth((t - .76) / .64));
          brush.rotation.z = -.46 - .12 * smooth((t - .76) / .64);
        } else {
          brushT = -1;
          brush.visible = false;   // 点简完成后再次隐藏
          brush.position.copy(BRUSH_IDLE);
          brush.rotation.z = -.58;
        }
      } else {
        brush.visible = false;
      }

      if (rippleT >= 0) {
        rippleT += dt;
        const k = clamp(rippleT / .85, 0, 1);
        const s = .3 + k * 1.35;
        ripple.scale.set(s, s, 1);
        ripple.material.opacity = .9 * (1 - k);
        if (k >= 1) rippleT = -1;
      }

      // 缓缓展卷：约 2.1 秒，逐片错峰展开
      if (prog < target) prog = Math.min(target, prog + dt / 2.1);
      else if (prog > target) prog = Math.max(target, prog - dt / 2.1);
      host.classList.toggle('open', prog > .45);

      roll.position.x = ROLL_X - .28 * prog;
      // 展开后压成左端卷边（仍留一点厚度），不再是一整个圆筒
      roll.scale.set(1 - .45 * prog, 1 - .06 * prog, 1 - .28 * prog);
      roll.rotation.y = -2.3 * prog;
      titleMesh.material.opacity = 1 - smooth(prog * 1.5);

      for (const m of slips) {
        const u = m.userData;
        const e = smooth((prog - u.i * stagger) / .5);
        m.position.x = ROLL_X + (u.targetX - ROLL_X) * e;
        m.position.z = u.targetZ * e + .1 * (1 - e);
        m.rotation.y = (Math.PI / 2) * (1 - e);
        m.scale.set(1, .94 + .06 * e, 1);
        m.material.opacity = e;
        const isActive = u.i === activeIdx && u.pick !== null;
        const isHover = u.i === hoverIdx && u.pick !== null;
        const want = isActive ? 1.05 : (isHover ? .5 : .04);
        m.material.emissiveIntensity += (want - m.material.emissiveIntensity) * Math.min(1, dt * 8);
        m.material.color.setHex(isActive ? 0xffe7ae : 0xffffff);
        m.position.z += isActive ? .06 * e : 0;
      }
      const activeSlip = slips[activeIdx];
      activeGlow.visible = prog > .5 && !!activeSlip;
      if (activeGlow.visible) {
        activeGlow.position.set(activeSlip.position.x, 0, .02);
        activeGlow.material.opacity = .6 * activeSlip.material.opacity;
      }
      cordMat2.opacity = smooth(prog * 1.2);
      cords.visible = prog > .02;
      // 鼠标悬停可点竹简时预览其题头，移开后回到当前选中项
      const hov = hoverIdx >= 0 && slips[hoverIdx] && slips[hoverIdx].userData.pick !== null ? hoverIdx : -1;
      const label = bannerLabel(hov >= 0 ? hov : activeIdx);
      if (label !== currentLabel) { currentLabel = label; drawBanner(label); }
      banner.material.opacity = smooth((prog - .5) / .4);
      banner.visible = banner.material.opacity > .01;
      // 编绳跟着已展开的竹片逐段长出，不会先于竹片伸到空中
      const cordLen = Math.max(.01, cordSpan * smooth(prog));
      const cordRight = cordX0 + cordLen;
      for (const line of cordLines) {
        line.scale.y = cordLen / cordSpan;
        line.position.x = cordX0 + cordLen / 2;
      }
      for (const k of cordKnots) k.mesh.visible = SLIP_X0 + k.i * gap <= cordRight;
      r.render(sc, cam);
    }

    /* ---------- 拾取（事件只落在透明命中层，空白可穿透到主星云） ---------- */
    const ray = new THREE.Raycaster();
    function hit(ev) {
      const rect = canvas.getBoundingClientRect();
      const nx = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
      const ny = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
      if (nx < -1 || nx > 1 || ny < -1 || ny > 1) return null;
      ray.setFromCamera({ x: nx, y: ny }, cam);
      const objs = [rollHit];
      if (prog > .5) {
        for (const m of slips) {
          if (m.material.opacity > .6 && m.userData.pick !== null) objs.push(m);
        }
      }
      const r0 = ray.intersectObjects(objs, false);
      return r0.length ? r0[0].object : null;
    }

    let down = null;
    hitLayer.addEventListener('pointermove', (ev) => {
      const o = hit(ev);
      hoverIdx = o && o.userData.i !== undefined ? o.userData.i : -1;
      hitLayer.style.cursor = o ? 'pointer' : 'default';
    });
    hitLayer.addEventListener('pointerleave', () => { hoverIdx = -1; });
    hitLayer.addEventListener('pointerdown', (ev) => { down = { x: ev.clientX, y: ev.clientY }; });
    hitLayer.addEventListener('pointerup', (ev) => {
      if (!down || Math.hypot(ev.clientX - down.x, ev.clientY - down.y) > 6) { down = null; return; }
      down = null;
      const o = hit(ev);
      if (!o) return;
      if (o === rollHit) triggerBrush(undefined, null, true);
      else if (o.userData.pick !== null && o.userData.pick !== undefined) {
        const pick = o.userData.pick;
        triggerBrush(o.userData.targetX, () => onPick(pick), false);
      }
    });

    // 截图 / 演示入口：URL 带 #scrollopen 时直接呈现展卷终态
    if (location.hash === '#scrollopen') { open = true; target = 1; prog = 1; }

    let last = performance.now();
    function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min((now - last) / 1000, .05);
      last = now;
      update(reduceMotion && brushT < 0 ? 0 : dt);
    }
    requestAnimationFrame(loop);

    return {
      setActive(i) { activeIdx = i; }   // -1 = 全景，无高亮竹简
    };
  }

  /* ============================================================
     星域导航装配（3D 为主，WebGL 不可用时退回 DOM 竹简）
     ============================================================ */

  function buildScroll(list) {
    const meta = { volumes: list.length, books: allNodes.length };
    scrollUI = createScrollUI(list, (i) => {
      if (i < 0) goHome();
      else focusCluster(clusters[i]);
    }, meta);
    if (!scrollUI) {
      $('scroll3d').style.display = 'none';
      $('scroll').style.display = 'flex';
      buildScrollFallback(list);
    }
    syncScroll();
  }

  function buildScrollFallback(list) {
    const body = $('scrollBody');
    $('scrollCount').textContent = '凡 ' + list.length + ' 卷 · ' + allNodes.length + ' 册';
    body.innerHTML =
      list.map((v, i) => '<div class="slip" data-i="' + i + '">' + escapeHtml(v.vaultName) + '</div>').join('');
    body.addEventListener('click', (ev) => {
      const slip = ev.target.closest('.slip');
      if (slip) focusCluster(clusters[Number(slip.dataset.i)]);
    });
    $('scrollToggle').addEventListener('click', () => {
      const expanded = $('scroll').classList.toggle('expanded');
      if (!expanded) goHome();   // 收卷时还原星云全景，与 3D 版一致
    });
  }

  function syncScroll() {
    const cur = activeCluster ? clusters.indexOf(activeCluster) : -1;
    if (scrollUI) scrollUI.setActive(cur);
    document.querySelectorAll('#scrollBody .slip').forEach((s) => {
      s.classList.toggle('on', Number(s.dataset.i) === cur);
    });
  }

  /* ============================================================
     数据加载 + 主循环
     ============================================================ */

  async function boot() {
    let list;
    try {
      const res = await fetch('vault-list.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      list = await res.json();
    } catch (e) {
      showAlert(
        '读取 <code>vault-list.json</code> 失败（' + escapeHtml(e.message) + '）。<br>' +
        '请先执行 <code>node build.js</code>；' +
        '若是直接双击打开本文件，请改用本地服务：<code>npx serve</code> 或 <code>python -m http.server</code>。'
      );
      return;
    }

    if (!Array.isArray(list) || list.length === 0) {
      showAlert('未发现任何星域。请在根目录下放置含 <code>.md</code> 笔记的文件夹后执行 <code>node build.js</code>。');
      return;
    }

    const R = list.length > 1 ? 30 : 0;
    let graphs;
    try {
      graphs = await Promise.all(list.map(async (v) => {
        const res = await fetch(encodeURI(v.graphUrl), { cache: 'no-store' });
        if (!res.ok) throw new Error(v.graphUrl + ' HTTP ' + res.status);
        return res.json();
      }));
    } catch (e) {
      showAlert('图谱加载失败（' + escapeHtml(e.message) + '）。请执行 <code>node build.js</code> 后重试。');
      return;
    }

    list.forEach((v, i) => {
      const ang = (i / list.length) * Math.PI * 2;
      const anchor = new THREE.Vector3(Math.cos(ang) * R, rand(-3, 3), Math.sin(ang) * R);
      const hue = VAULT_HUES[i % VAULT_HUES.length];
      try {
        buildCluster(v, graphs[i], hue, anchor);
      } catch (e) {
        console.warn('星云构建失败', v.vaultName, e);
      }
    });

    buildScroll(list);

    // 调试入口：URL 带 #wave 时自动聚焦最高连接度节点所在的星云并触发蔓延（供截图/演示验证）
    if (location.hash === '#wave') {
      setTimeout(() => {
        const root = allNodes.reduce((a, b) => (b.deg > a.deg ? b : a));
        focusCluster(root.cluster);
        startWave(root);
      }, 800);
    }

    function stepTween() {
      if (!camTween) return;
      const k = clamp((performance.now() - camTween.start) / camTween.dur, 0, 1);
      const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      camera.position.lerpVectors(camTween.fromPos, camTween.toPos, e);
      controls.target.lerpVectors(camTween.fromTarget, camTween.toTarget, e);
      if (k >= 1) camTween = null;
    }

    let last = performance.now();
    function loop(nowMs) {
      requestAnimationFrame(loop);
      const dt = Math.min((nowMs - last) / 1000, 0.05);
      last = nowMs;
      const step = reduceMotion ? 0 : dt;
      simEpoch += step;
      stepTween();
      controls.update();
      bg.update(step);
      applyDrag(step);
      applyClusterVisual(step);
      applyNodeVisual(step);
      applyEdgeFlow(step);
      updateWave();
      renderer.render(scene, camera);
    }
    requestAnimationFrame(loop);
  }

  boot();
  </script>
</body>
</html>
